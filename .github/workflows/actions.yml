name: GitHub Actions
on: [push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: maven:3.10.0-eclipse-temurin-25
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Show Java and Maven versions
        shell: bash
        run: |
          java --version
          mvn --version
      - name: Run unit tests
        shell: bash
        run: |
          mvn -B -ntp test
